[package]
name = "coverant"
version = "0.4.0"
edition = "2024"
description = "Radio coverage planner: sites, antennas and Longley-Rice coverage maps"
license = "GPL-3.0-or-later"
repository = "https://github.com/tanganyika/coverant"
authors = ["tanganyika"]

[package.metadata.deb]
section = "hamradio"
priority = "optional"
depends = "$auto, libxkbcommon-x11-0, libgl1"
recommends = "libvulkan1, xdg-desktop-portal"
extended-description = """\
Coverant plans radio sites in the spirit of Radio Mobile: define sites from lat/long, \
Maidenhead locators or OS grid references, keep a library of antennas, and plot \
Longley-Rice (ITM) coverage for hand portables, mobiles and base stations over real terrain."""
assets = [
    ["target/release/coverant", "usr/bin/", "755"],
    ["assets/coverant.desktop", "usr/share/applications/", "644"],
    ["assets/coverant.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["README.md", "usr/share/doc/coverant/", "644"],
]

[dependencies]
dirs = "6"
eframe = { version = "0.37.0", features = ["glow"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
num-complex = "0.4.6"
rayon = "1.12.0"
regex = "1"
rfd = "0.18.0"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
