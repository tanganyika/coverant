# Tests and builds Coverant for Linux, Windows and macOS on every push and pull request.
# The programs are attached to each run (Actions tab -> the run -> Artifacts); a version tag
# (v*) also makes a GitHub release with them.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: coverant
          - os: windows-latest
            name: windows-x86_64
            bin: coverant.exe
          - os: macos-latest
            name: macos-arm64
            bin: coverant
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          D=coverant-${{ matrix.name }}
          mkdir -p $D dist
          cp target/release/${{ matrix.bin }} README.md LICENSE $D/
          if [ "${{ runner.os }}" = Windows ]; then 7z a dist/$D.zip $D >/dev/null; else tar czf dist/$D.tar.gz $D; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
