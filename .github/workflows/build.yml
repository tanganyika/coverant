# Tests and builds Coverant for Linux, Windows and macOS on every push and pull request.
# The programs are attached to each run (Linux .deb and .tar.gz, Windows installer and .zip,
# macOS .tar.gz; Actions tab -> the run -> Artifacts); a version tag
# (v0.1.0 or 0.1.0) also makes a GitHub release with them. To attach the programs to a release
# that already exists, run this workflow by hand with its tag. Releases also update the APT
# repository on GitHub Pages (needs the APT_GPG_PRIVATE_KEY secret).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the builds to this existing release tag (leave empty for a plain build)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            bin: coverant
          - os: windows-latest
            name: windows-x86_64
            bin: coverant.exe
          - os: macos-latest
            name: macos-arm64
            bin: coverant
    runs-on: ${{ matrix.os }}
    env:
      # link the C runtime into the program, so it starts on PCs without the
      # Visual C++ Redistributable (VCRUNTIME140.dll)
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Check it needs no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if objdump -p target/release/coverant.exe | grep -iE 'DLL Name: (vcruntime|msvcp|api-ms-win-crt)'; then
            echo "::error::coverant.exe needs the Visual C++ runtime"; exit 1
          fi
      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
          mkdir -p dist && cp target/debian/*.deb dist/
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          ISCC=$(ls "/c/Program Files (x86)"/Inno\ Setup\ */ISCC.exe "/c/Program Files"/Inno\ Setup\ */ISCC.exe 2>/dev/null | tail -1 || true)
          if [ -z "$ISCC" ]; then
            choco install innosetup -y --no-progress
            ISCC=$(ls "/c/Program Files (x86)"/Inno\ Setup\ */ISCC.exe "/c/Program Files"/Inno\ Setup\ */ISCC.exe | tail -1)
          fi
          "$ISCC" //Q //DVersion=$VER packaging/windows/coverant.iss
          ls -l dist
      - name: Package
        shell: bash
        run: |
          D=coverant-${{ matrix.name }}
          mkdir -p $D dist
          cp target/release/${{ matrix.bin }} README.md LICENSE $D/
          if [ "${{ runner.os }}" = Windows ]; then 7z a dist/$D.zip $D >/dev/null; else tar czf dist/$D.tar.gz $D; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*

  # The APT repository on GitHub Pages (gh-pages branch): adds the new .deb, keeps the last three
  # versions and signs the index with the APT_GPG_PRIVATE_KEY secret (skipped while it is unset).
  apt:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: packages
      - name: Update the APT repository
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::notice::No APT_GPG_PRIVATE_KEY secret, so the APT repository was not updated"
            exit 0
          fi
          command -v apt-ftparchive || sudo apt-get install -y apt-utils
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          SITE="$RUNNER_TEMP/site"
          mkdir "$SITE"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git archive FETCH_HEAD | tar -x -C "$SITE"
          fi
          packaging/linux/apt-repo.sh "$SITE" packages/coverant_*_amd64.deb 3
          touch "$SITE/.nojekyll"
          [ -f "$SITE/index.html" ] || echo '<!doctype html><meta http-equiv="refresh" content="0; url=apt/">' > "$SITE/index.html"
          # a single commit each time, so old packages don't pile up in the history
          cd "$SITE"
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" commit -q -m "APT repository for ${{ inputs.release_tag || github.ref_name }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
