# Tests and builds Coverant for Linux, Windows and macOS on every push and pull request.
# The programs are attached to each run (Actions tab -> the run -> Artifacts); a version tag
# (v0.1.0 or 0.1.0) also makes a GitHub release with them. To attach the programs to a release
# that already exists, run this workflow by hand with its tag.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the builds to this existing release tag (leave empty for a plain build)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            bin: coverant
          - os: windows-latest
            name: windows-x86_64
            bin: coverant.exe
          - os: macos-latest
            name: macos-arm64
            bin: coverant
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
          mkdir -p dist && cp target/debian/*.deb dist/
      - name: Package
        shell: bash
        run: |
          D=coverant-${{ matrix.name }}
          mkdir -p $D dist
          cp target/release/${{ matrix.bin }} README.md LICENSE $D/
          if [ "${{ runner.os }}" = Windows ]; then 7z a dist/$D.zip $D >/dev/null; else tar czf dist/$D.tar.gz $D; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
